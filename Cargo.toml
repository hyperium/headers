[package]
name = "headers"
version = "0.4.2"
description = "typed HTTP headers"
license = "MIT"
readme = "README.md"
homepage = "https://hyper.rs"
repository = "https://github.com/hyperium/headers"
authors = ["Sean McArthur <sean@seanmonstar.com>"]
keywords = ["http", "headers", "hyper", "hyperium"]
categories = ["web-programming"]
edition = "2018"
rust-version = "1.57"

[workspace]
members = ["headers-core"]

[dependencies]
http = "1.0.0"
headers-core = { version = "0.3", path = "./headers-core" }
base64 = "0.22"
bytes = "1"
mime = "0.3.14"
# TODO: replace with `0.11` once MSRV >= 1.85
# There are no breaking changes in sha1 0.11, other than MSRV increase
sha1 = ">=0.10, <0.12"
httpdate = "1"

[features]
nightly = []
